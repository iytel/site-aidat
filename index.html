<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Başpınar Sitesi</title>
  
  <!-- Mobil Tam Ekran ve Zoom Engelleme -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d6efd">

  <!-- Android Uygulama Kimliği -->
  <link rel="manifest" href="manifest.json?v=8">

  <!-- iOS (iPhone) Tam Ekran Uygulama Ayarları -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Başpınar Sitesi">
  <link rel="apple-touch-icon" href="/icon.png">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f4f6f9;
    }
    
    /* Google uyarı şeridini (26px) ekranın üst dışına iterek gizler */
    iframe {
      position: absolute;
      top: -26px; 
      left: 0;
      width: 100%;
      height: calc(100% + 26px);
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <iframe 
    src="https://script.google.com/macros/s/AKfycbzW7xZ_69sk8fYWniEIL-g9IY2mYyFD4cpf7VCl41Km-i3M41b9wHoTqULMwKybTzv2WQ/exec" 
    allow="clipboard-read; clipboard-write; storage-access"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation">
  </iframe>

  <script>
    // Eski takılı kalan Service Worker ve önbellekleri temizler
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) caches.delete(name);
      });
    }
  </script>

</body>
</html>
